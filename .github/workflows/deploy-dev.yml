name: Deploy Dev Webapp to AWS ECS

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev-webapp
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: development
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      ECR_REPOSITORY: eezevent-webapp
      ECS_CLUSTER: eezevent-dev-cluster
      ECS_SERVICE: eezevent-dev-webapp-service
      GOOGLE_WEB_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      APPLE_WEB_CLIENT_ID: ${{ vars.NEXT_PUBLIC_APPLE_WEB_CLIENT_ID }}
      APPLE_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_APPLE_REDIRECT_URI }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_ROLE_ARN:?Set development environment variable AWS_ROLE_ARN}"
          : "${GOOGLE_WEB_CLIENT_ID:?Set development environment variable NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID}"
          [[ "$AWS_ROLE_ARN" == arn:aws:iam::250830191532:role/* ]]
          [[ "$GOOGLE_WEB_CLIENT_ID" == *.apps.googleusercontent.com ]]

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test
        run: |
          npm ci --no-audit --no-fund
          node --test tests/*.test.*

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '250830191532'

      - name: Read the currently deployed task definition
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" > service.json
          jq -e '.failures | length == 0' service.json
          jq -e '.services | length == 1' service.json
          jq -e '.services[0].status == "ACTIVE" and .services[0].desiredCount > 0' service.json
          TASK_ARN=$(jq -r '.services[0].taskDefinition' service.json)
          aws ecs describe-task-definition --task-definition "$TASK_ARN" \
            --query taskDefinition > task-definition.json
          jq -e '.family == "eezevent-dev-webapp" and ([.containerDefinitions[] | select(.name == "webapp")] | length == 1)' task-definition.json

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:dev-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://dev-api.eezevent.com
            NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT_ID }}
            NEXT_PUBLIC_APPLE_WEB_CLIENT_ID=${{ env.APPLE_WEB_CLIENT_ID }}
            NEXT_PUBLIC_APPLE_REDIRECT_URI=${{ env.APPLE_REDIRECT_URI }}
            NEXT_PUBLIC_AUTH_MODE=social_only
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Render the new task definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: webapp
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}

      - name: Deploy to ECS and wait for stability
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Verify ECS did not roll back the release
        env:
          EXPECTED_TASK: ${{ steps.deploy.outputs.task-definition-arn }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" > deployed-service.json
          jq -e --arg expected "$EXPECTED_TASK" '
            (.failures | length == 0) and
            (.services | length == 1) and
            (.services[0] | .taskDefinition == $expected and
              .runningCount == .desiredCount and .pendingCount == 0 and
              any(.deployments[]; .status == "PRIMARY" and
                .taskDefinition == $expected and .rolloutState == "COMPLETED"))
          ' deployed-service.json
          {
            echo '### Dev webapp deployed'
            echo '- URL: https://webapp-dev.eezevent.com'
            printf -- '- Image digest: `%s`\n' "$IMAGE_DIGEST"
            printf -- '- Task definition: `%s`\n' "$EXPECTED_TASK"
          } >> "$GITHUB_STEP_SUMMARY"
